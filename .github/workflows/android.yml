# The phone app, built for Android: its native project generated by `expo prebuild` and
# compiled to a release APK, so a change to the Kotlin module, the app config or a native
# dependency is caught without a phone. It only builds the app; running it needs an emulator
# or a device (apps/mobile/README.md, "Android"). The runner has the Android SDK, and Gradle
# fetches the platform, build tools and NDK that React Native asks for.
name: Android

on:
  pull_request:
    paths: ['apps/mobile/**', 'core/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'core/**', '.github/workflows/android.yml']

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-app:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - run: pnpm prebuild:android --no-install
      # One ABI is enough to know the native code compiles, in a quarter of the time.
      - run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
        working-directory: apps/mobile/android
