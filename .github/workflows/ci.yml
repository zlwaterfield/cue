# The checks that don't need a Mac: both apps' typecheck, and the Mac app's unit tests.
#
# The rest stay local, because they need hardware or a server this runner hasn't got. The
# end-to-end tests (`pnpm test:e2e`) drive the packaged Mac app, the sync and MCP tests
# (`pnpm test:sync`) need a local Supabase, and `pnpm bench` measures a real machine.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A later push to a branch makes the earlier run's answer moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-app:
    name: Mac app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Both use the pnpm from package.json's `packageManager`.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  iphone-app:
    name: iPhone app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
