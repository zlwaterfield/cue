appId: com.zlwaterfield.cue
productName: Cue
copyright: Copyright © 2026 Zach Waterfield
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# All code is bundled by electron-vite, and package.json has no runtime
# dependencies, so nothing from node_modules ships.
mac:
  category: public.app-category.productivity
  # Icon Composer source (docs/brand/app-icon/ICON-COMPOSER.md). electron-builder compiles it
  # with Xcode 26's actool into Assets.car for macOS 26 and a generated icon.icns for older macOS.
  icon: build/Cue.icon
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  darkModeSupport: true
  # Ad-hoc signed ("-") so local builds verify and run without an Apple Developer account.
  # Distributed builds should use a Developer ID identity and notarization instead.
  identity: '-'
  # Hardened runtime is required for notarization; enable it with a Developer ID identity.
  hardenedRuntime: false
  extendInfo:
    LSApplicationCategoryType: public.app-category.productivity
    NSSupportsAutomaticGraphicsSwitching: true
dmg:
  title: Cue
  # Brand kit DMG (docs/brand/dmg): 540 × 380, 128 px icons, retina TIFF background.
  background: build/dmg-background.tiff
  iconSize: 128
  window:
    width: 540
    height: 380
  contents:
    - x: 150
      y: 170
    - x: 390
      y: 170
      type: link
      path: /Applications
