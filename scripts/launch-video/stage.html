<!doctype html>
<!--
  The launch video's frame, drawn once and then asked for a time.

  `compose.mjs` calls CUE.init(data) and then CUE.seek(t) for every frame of the
  film and screenshots the result, so nothing here may animate on its own: every
  position, opacity and image comes from t. That is what keeps the render exact
  however long a frame takes to paint.

  Colors are the brand tokens (docs/brand/tokens), and the window around the
  footage is the same frame scripts/frame.swift puts on the README screenshots.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cue — launch video stage</title>
<style>
@font-face { font-family: "Newsreader"; font-style: normal; font-weight: 400; font-display: block;
  src: url("../../site/fonts/newsreader-latin.woff2") format("woff2"); }

:root {
  --paper: #FAFAFB;
  --night: #18181A;
  --ink: #1C1C1E;
  --ink-dark: #ECECEF;
  --ink-2: #6C6C72;
  --ink-2-dark: #9D9DA4;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
  --serif: "Newsreader", "New York", ui-serif, Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;

  /* Set per frame from JS. */
  --text: var(--ink);
  --text-2: var(--ink-2);
  --keycap-bg: #FFFFFF;
  --keycap-line: #0000001F;
  --keycap-text: var(--ink);
  --mac-bg: #FFFFFF;
  --mac-edge: rgba(0, 0, 0, 0.14);
  --mac-shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 12px 30px rgba(0, 0, 0, 0.14), 0 36px 80px rgba(0, 0, 0, 0.12);
}

* { box-sizing: border-box; margin: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; }
body { background: var(--paper); font-family: var(--sans); -webkit-font-smoothing: antialiased; }

#night { position: absolute; inset: 0; background: var(--night); }

/* The caption band, above everything the film is showing. */
.caption { position: absolute; left: 0; right: 0; top: 68px; text-align: center; color: var(--text);
  will-change: opacity, transform; }
.caption .line { font-family: var(--serif); font-weight: 400; font-size: 52px; line-height: 1.12;
  letter-spacing: -0.02em; font-optical-sizing: auto; }
.caption .sub { margin-top: 14px; font-size: 21px; line-height: 1.4; color: var(--text-2); }

/* The Mac, framed the way the README screenshots are. */
#mac { position: absolute; left: 960px; top: 584px;
  transform-origin: 50% 50%; will-change: transform, opacity; }
#mac .body { position: absolute; inset: 0; border-radius: 11px; background: var(--mac-bg); overflow: hidden; }
#mac .body img { display: block; }
#mac .edge { position: absolute; inset: 0; border-radius: 11px; pointer-events: none;
  box-shadow: inset 0 0 0 1px var(--mac-edge); }
#mac .shadow { position: absolute; inset: 0; border-radius: 11px; z-index: -1; box-shadow: var(--mac-shadow); }
#mac .lights { position: absolute; left: 18px; top: 18px; display: flex; gap: 8px; }
#mac .lights i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.12); }
#mac .lights i:nth-child(1) { background: #FF5F57; }
#mac .lights i:nth-child(2) { background: #FEBC2E; }
#mac .lights i:nth-child(3) { background: #28C840; }

/* The iPhone, from the App Store screenshots. */
#phone { position: absolute; left: 960px; top: 584px; padding: 14px; background: #0B0B0D;
  border-radius: 48px; transform-origin: 50% 50%; will-change: transform, opacity;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3), 0 30px 70px rgba(0, 0, 0, 0.45); }
#phone .screen { position: relative; width: 304px; height: 660px; border-radius: 34px; overflow: hidden;
  background: #000; }
#phone .screen img { display: block; width: 100%; height: 100%; object-fit: cover; }
#phone .island { position: absolute; left: 50%; top: 11px; width: 82px; height: 24px; border-radius: 999px;
  background: #0B0B0D; transform: translateX(-50%); }

/* Keycaps, the same shape the app draws in its palette, at video size. */
#keys { position: absolute; left: 0; right: 0; top: 998px; display: flex; justify-content: center; gap: 8px;
  will-change: opacity, transform; }
#keys kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 46px; height: 46px;
  padding: 0 14px; border-radius: 11px; font: 500 24px/1 var(--mono); color: var(--keycap-text);
  background: var(--keycap-bg); box-shadow: inset 0 0 0 1px var(--keycap-line), 0 1px 2px rgba(0, 0, 0, 0.05); }

/* The opening and closing cards. */
.card { position: absolute; left: 0; right: 0; text-align: center; color: var(--text);
  will-change: opacity, transform; }
.card .lockup { display: block; margin: 0 auto; color: var(--text); }
.card .line { font-family: var(--serif); font-weight: 400; letter-spacing: -0.02em; font-optical-sizing: auto; }
#open-card { top: 430px; }
#open-card .lockup { height: 46px; }
#open-card .line { margin-top: 44px; font-size: 64px; line-height: 1.08; }
#close-card { top: 352px; }
#close-card .lockup { height: 56px; }
#close-card .line { margin-top: 48px; font-size: 60px; line-height: 1.08; }
#close-card .sub { margin-top: 26px; font-size: 23px; color: var(--text-2); }
#close-card .url { margin-top: 20px; font-size: 26px; letter-spacing: -0.01em; }
</style>
</head>
<body>
<div id="night"></div>
<div id="mac"><div class="shadow"></div><div class="body"><img id="shot" alt=""><div class="lights"><i></i><i></i><i></i></div></div><div class="edge"></div></div>
<div id="phone"><div class="screen"><img id="phone-shot" alt=""><div class="island"></div></div></div>
<div class="caption" id="cap-a"><div class="line"></div><div class="sub"></div></div>
<div class="caption" id="cap-b"><div class="line"></div><div class="sub"></div></div>
<div id="keys"></div>
<div class="card" id="open-card"><div class="lockup"></div><div class="line"></div></div>
<div class="card" id="close-card"><div class="lockup"></div><div class="line"></div><div class="sub"></div><div class="url"></div></div>

<script>
const $ = (id) => document.getElementById(id)
const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x)
/** Smoothstep: every fade and move in the film is eased with this one curve. */
const ease = (x) => { const t = clamp01(x); return t * t * (3 - 2 * t) }
/** Eased progress through [a, b]. */
const span = (t, a, b) => ease((t - a) / (b - a))
const mix = (a, b, k) => a + (b - a) * k
const px = (n) => `${n}px`

const CUE = {
  data: null,

  init(data) {
    this.data = data
    this.frame = -1
    for (const card of ['open-card', 'close-card']) $(card).querySelector('.lockup').innerHTML = data.lockup
    $('open-card').querySelector('.line').textContent = data.opening.caption
    const close = $('close-card')
    close.querySelector('.line').textContent = data.closing.caption
    close.querySelector('.sub').textContent = data.closing.sub
    close.querySelector('.url').textContent = data.closing.url
    $('phone-shot').src = data.devices.screen
    const mac = $('mac').style
    mac.width = px(data.mac.width)
    mac.height = px(data.mac.height)
    const shot = $('shot').style
    shot.width = px(data.mac.width)
    shot.height = px(data.mac.height)
  },

  /** Draw the film at `t` seconds. Resolves once the frame is ready to screenshot. */
  async seek(t) {
    const d = this.data
    // The app flips appearance in one frame, so the page around it does too: a
    // fade between paper and night would spend its middle on a grey that is in
    // neither palette. The 0.07s is the app's own render lag.
    const dark = t >= d.darkAt + 0.07 ? 1 : 0
    this.paint(t, dark)
    return this.showFootage(t)
  },

  /** The footage frame that was on screen at `t`, held until the next one arrives. */
  async showFootage(t) {
    const d = this.data
    const u = t - d.appAt
    let lo = 0, hi = d.footage.length - 1, found = 0
    while (lo <= hi) {
      const mid = (lo + hi) >> 1
      if (d.footage[mid].t <= u) { found = mid; lo = mid + 1 } else hi = mid - 1
    }
    if (found === this.frame) return
    this.frame = found
    const img = $('shot')
    img.src = d.footage[found].src
    await img.decode().catch(() => {})
  },

  paint(t, dark) {
    const d = this.data
    const root = document.documentElement.style
    root.setProperty('--text', dark > 0.5 ? 'var(--ink-dark)' : 'var(--ink)')
    root.setProperty('--text-2', dark > 0.5 ? 'var(--ink-2-dark)' : 'var(--ink-2)')
    root.setProperty('--keycap-bg', dark > 0.5 ? '#2C2C30' : '#FFFFFF')
    root.setProperty('--keycap-line', dark > 0.5 ? '#FFFFFF26' : '#0000001F')
    root.setProperty('--keycap-text', dark > 0.5 ? 'var(--ink-dark)' : 'var(--ink)')
    root.setProperty('--mac-bg', dark > 0.5 ? '#18181A' : '#FFFFFF')
    root.setProperty('--mac-edge', dark > 0.5 ? 'rgba(255, 255, 255, 0.12)' : 'rgba(0, 0, 0, 0.14)')
    // frame.swift shadows a dark window harder than a light one; so does this.
    root.setProperty('--mac-shadow', dark > 0.5
      ? '0 2px 6px rgba(0, 0, 0, 0.45), 0 18px 44px rgba(0, 0, 0, 0.5), 0 44px 96px rgba(0, 0, 0, 0.4)'
      : '0 1px 2px rgba(0, 0, 0, 0.05), 0 12px 30px rgba(0, 0, 0, 0.14), 0 36px 80px rgba(0, 0, 0, 0.12)')
    $('night').style.opacity = dark

    // Opening card: in, held, then up and out as the app arrives.
    const o = d.opening
    const openOut = span(t, o.out, o.out + 0.55)
    $('open-card').style.opacity = span(t, 0.15, 0.85) * (1 - openOut)
    $('open-card').style.transform = `translateY(${px(mix(14, 0, span(t, 0.15, 1.0)) - openOut * 26)})`

    // Closing card: in as the devices leave.
    const c = d.closing
    $('close-card').style.opacity = span(t, c.at, c.at + 0.7)
    $('close-card').style.transform = `translateY(${px(mix(18, 0, span(t, c.at, c.at + 0.9)))})`

    this.paintMac(t)
    this.paintPhone(t)
    this.paintCaptions(t)
    this.paintKeys(t)
  },

  paintMac(t) {
    const d = this.data
    const dev = d.devices
    const macIn = span(t, d.appAt - 0.3, d.appAt + 0.35)
    const macOut = span(t, dev.at + dev.seconds - 0.55, dev.at + dev.seconds - 0.05)
    const pair = span(t, dev.at - 0.2, dev.at + 0.9)
    const scale = mix(d.mac.scale, d.mac.scale * dev.macScale, pair)
    const dx = mix(0, dev.macShift, pair)
    const rise = mix(26, 0, macIn)
    $('mac').style.opacity = macIn * (1 - macOut)
    $('mac').style.transform = `translate(-50%, -50%) translate(${px(dx)}, ${px(rise - macOut * 20)}) scale(${scale})`
  },

  paintPhone(t) {
    const dev = this.data.devices
    const show = span(t, dev.at + 0.15, dev.at + 1.0)
    const out = span(t, dev.at + dev.seconds - 0.55, dev.at + dev.seconds - 0.05)
    $('phone').style.opacity = show * (1 - out)
    const dx = mix(dev.phoneShift + 70, dev.phoneShift, show)
    $('phone').style.transform = `translate(-50%, -50%) translate(${px(dx)}, ${px(out * -20)}) scale(${mix(0.97, 1, show)})`
  },

  /**
   * Captions fade through rather than across: one is gone before the next starts,
   * so two lines of type never sit on top of each other. Two layers, because the
   * tail of one still overlaps the lead-in of the next by a hair.
   */
  paintCaptions(t) {
    const cues = this.data.cues
    const layers = [$('cap-a'), $('cap-b')]
    layers[0].style.opacity = 0
    layers[1].style.opacity = 0
    let i = -1
    while (i + 1 < cues.length && cues[i + 1].at <= t) i++
    for (let k = 0; k < 2; k++) {
      const index = i - k
      if (index < 0) continue
      const layer = layers[(index % 2 + 2) % 2]
      const cue = cues[index]
      const leaves = cues[index + 1]?.at ?? cue.until
      const grow = span(t, cue.at + 0.3, cue.at + 0.64)
      const fade = span(t, leaves, leaves + 0.24)
      layer.querySelector('.line').textContent = cue.caption ?? ''
      layer.querySelector('.sub').textContent = cue.sub ?? ''
      layer.style.opacity = grow * (1 - fade)
      layer.style.transform = `translateY(${px(mix(12, 0, grow) - fade * 10)})`
    }
  },

  paintKeys(t) {
    const shown = this.data.keys.find((k) => t >= k.at - 0.1 && t <= k.at + 1.5)
    const el = $('keys')
    if (!shown) { el.style.opacity = 0; return }
    const grow = span(t, shown.at - 0.1, shown.at + 0.18)
    const fade = span(t, shown.at + 1.15, shown.at + 1.5)
    if (el.dataset.at !== String(shown.at)) {
      el.dataset.at = String(shown.at)
      el.innerHTML = shown.glyphs.map((g) => `<kbd>${g}</kbd>`).join('')
    }
    el.style.opacity = grow * (1 - fade)
    el.style.transform = `translateY(${px(mix(8, 0, grow))}) scale(${mix(0.96, 1, grow)})`
  }
}
window.CUE = CUE
</script>
</body>
</html>
