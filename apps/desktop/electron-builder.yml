appId: app.cue
productName: Cue
copyright: Copyright © 2026 Zach Waterfield
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# All code is bundled by electron-vite, and package.json has no runtime
# dependencies, so nothing from node_modules ships.

# Where release builds look for updates (src/main/updates.ts), and the only reason
# electron-builder writes release/latest-mac.yml — the manifest the updater reads, and one of
# the files `pnpm release:upload` puts on the release. It used to work the repository out from
# <projectDir>/.git/config, which found nothing once the app moved into apps/ and the
# repository root went a level up; named here, a build from a renamed remote or a fork still
# points back here. It also goes into the app as Resources/app-update.yml, which the updater
# reads for its download cache. Nothing is uploaded by electron-builder itself: `pnpm release`
# passes --publish never, so nothing reaches GitHub until `pnpm release:upload`.
publish:
  provider: github
  owner: zlwaterfield
  repo: cue

# cue://add?text=… adds a line to today (src/main/addToToday.ts), for bookmarklets and
# Shortcuts. It lands in Info.plist as CFBundleURLTypes.
protocols:
  - name: Cue
    schemes: [cue]

mac:
  category: public.app-category.productivity
  # Icon Composer source (brand/app-icon/ICON-COMPOSER.md). electron-builder compiles it
  # with Xcode 26's actool into Assets.car for macOS 26 and a generated icon.icns for older macOS.
  icon: build/Cue.icon
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  darkModeSupport: true
  # Ad-hoc signed ("-") so local builds verify and run without an Apple Developer account.
  # `pnpm release` signs with your Developer ID instead and notarizes (scripts/release.mjs).
  identity: '-'
  # Notarization requires the hardened runtime, which `pnpm release` turns on. An ad-hoc build
  # can't use it: library validation rejects Electron's frameworks without a team ID.
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    LSApplicationCategoryType: public.app-category.productivity
    NSSupportsAutomaticGraphicsSwitching: true
    # What macOS shows the first time ⌃⌥⌘L asks a browser for its tab (src/main/capture.ts).
    NSAppleEventsUsageDescription: Cue asks your browser for the address of the tab you’re on when you save it to today. It doesn’t read or change anything else.
dmg:
  title: Cue
  # Brand kit DMG (brand/dmg): 540 × 380, 128 px icons, retina TIFF background.
  background: build/dmg-background.tiff
  iconSize: 128
  window:
    width: 540
    height: 380
  contents:
    - x: 150
      y: 170
    - x: 390
      y: 170
      type: link
      path: /Applications
