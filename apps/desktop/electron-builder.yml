appId: app.cue
productName: Cue
copyright: Copyright © 2026 Zach Waterfield
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# All code is bundled by electron-vite, and package.json has no runtime
# dependencies, so nothing from node_modules ships.

# Where the build is published. electron-builder only writes release/latest-mac.yml — the
# manifest an auto-updater reads, and one of the files `pnpm release:upload` puts on the
# release — when it knows the repository. It used to read that from .git/config, which stopped
# working when the app moved into apps/ and the repository root went a level up, so it's named
# here. Nothing is uploaded by electron-builder itself: `pnpm release` passes --publish never.
publish:
  provider: github
  owner: zlwaterfield
  repo: cue

mac:
  category: public.app-category.productivity
  # Icon Composer source (brand/app-icon/ICON-COMPOSER.md). electron-builder compiles it
  # with Xcode 26's actool into Assets.car for macOS 26 and a generated icon.icns for older macOS.
  icon: build/Cue.icon
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  darkModeSupport: true
  # Ad-hoc signed ("-") so local builds verify and run without an Apple Developer account.
  # `pnpm release` signs with your Developer ID instead and notarizes (scripts/release.mjs).
  identity: '-'
  # Notarization requires the hardened runtime, which `pnpm release` turns on. An ad-hoc build
  # can't use it: library validation rejects Electron's frameworks without a team ID.
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    LSApplicationCategoryType: public.app-category.productivity
    NSSupportsAutomaticGraphicsSwitching: true
dmg:
  title: Cue
  # Brand kit DMG (brand/dmg): 540 × 380, 128 px icons, retina TIFF background.
  background: build/dmg-background.tiff
  iconSize: 128
  window:
    width: 540
    height: 380
  contents:
    - x: 150
      y: 170
    - x: 390
      y: 170
      type: link
      path: /Applications
