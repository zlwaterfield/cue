plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.cue'
version = '1.0.0'

expoModule {
  v2 true
}

android {
  namespace "app.cue.nativemodule"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // ReactEditText, to focus a line the way ref.focus() does, and RootView.
  implementation 'com.facebook.react:react-android'
}
