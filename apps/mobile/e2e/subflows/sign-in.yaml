# Turn on sync from Settings with an emailed code (local Supabase; the code is read from
# Mailpit). Signed in, the day comes back.
appId: app.cue
---
- tapOn: "Settings"
- tapOn:
    id: settings-sync
- tapOn: "Turn On Sync…"
- extendedWaitUntil:
    visible: "Sign in to sync your notes"
    timeout: 10000
- tapOn:
    id: "email"
- eraseText: 80
- inputText: ${EMAIL}
- tapOn: "Send Code"
- extendedWaitUntil:
    visible: "Enter the code we sent to"
    timeout: 15000
- runScript:
    file: ../scripts/sign-in-code.js
    env:
      EMAIL: ${EMAIL}
- inputText: ${output.code}
- extendedWaitUntil:
    visible:
      id: "day-title"
    timeout: 20000
