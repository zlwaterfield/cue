# Turning sync on with a different account works the Mac's way: the phone's notes stay,
# and go to the new account too.
appId: app.cue
name: Account switch
---
- runFlow: subflows/launch.yaml
- runScript: scripts/today.js
- runScript:
    file: scripts/email.js
    env:
      PREFIX: account-switch-a
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.email}

- tapOn:
    id: ${'new-line-' + output.today}
- inputText: "Written with A"
- tapOn:
    id: tool-hide

- tapOn: "Settings"
- tapOn:
    id: settings-sync
- tapOn: "Turn Off Sync"
- extendedWaitUntil:
    visible: "Turn On Sync…"
    timeout: 5000
- tapOn:
    id: sheet-close

- runScript:
    file: scripts/email.js
    env:
      PREFIX: account-switch-b
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.email}
- assertVisible:
    id: "0/text:Written with A"

# Another device signs in to B (writing a line as it does) and reads the account back.
- runScript:
    file: scripts/push-from-another-device.js
    env:
      EMAIL: ${output.email}
      TODAY: ${output.today}
      TEXT: "Written on the Mac"
      SUPABASE_KEY: ${SUPABASE_KEY}
- extendedWaitUntil:
    visible:
      id: "0/todo:Written on the Mac"
    timeout: 5000
- retry:
    maxRetries: 3
    commands:
      - runScript:
          file: scripts/pull-from-another-device.js
          env:
            TEXT: "Written with A"
            SUPABASE_KEY: ${SUPABASE_KEY}
      - assertTrue: ${output.found}
