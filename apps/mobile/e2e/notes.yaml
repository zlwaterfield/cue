# Notes on the phone: the Notes tab opens scratch, the plus starts a note named by its
# first line, the strip switches between notes, and Delete can be undone.
appId: app.cue
name: Notes
---
- runFlow: subflows/launch.yaml

# The Notes tab, at the bottom: scratch, with the notes there are where the week was.
- tapOn:
    id: tab-notes
- assertVisible:
    id: "note-Scratch"
- assertVisible: "Type or paste anything. It stays until you clear it."

# The plus starts a note, keyboard up on the line that names it.
- tapOn:
    id: note-new
- extendedWaitUntil:
    visible:
      id: tool-hide
    timeout: 5000
- inputText: "Books to read"
- pressKey: Enter
- inputText: "[] Middlemarch"
- tapOn:
    id: tool-hide
- assertVisible:
    id: "note-Books to read"
- assertVisible:
    id: "0/text:Books to read"
- assertVisible:
    id: "0/todo:Middlemarch"

# Scratch is its own page, and the note is one tap away.
- tapOn:
    id: "note-Scratch"
- assertVisible: "Type or paste anything. It stays until you clear it."
- tapOn:
    id: "note-Books to read"
- assertVisible:
    id: "0/todo:Middlemarch"

# Deleting a note leaves scratch; Undo brings it back.
- tapOn:
    id: note-delete
- assertNotVisible:
    id: "note-Books to read"
- tapOn: "Undo"
- assertVisible:
    id: "note-Books to read"

# The Today tab leaves notes for the day.
- tapOn:
    id: tab-today
- assertVisible:
    id: "day-title"
    text: "Today"
