# Local Supabase stack for developing and testing Cue sync and its MCP server:
#
#   npx supabase start -x studio,storage-api,imgproxy,logflare,vector,postgres-meta,supavisor
#
# A hosted project uses the same migrations and function (docs/SYNC.md, docs/MCP.md).
# Anything not set here uses the CLI's defaults.
project_id = "cue"

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public"]

[db]
port = 54322
major_version = 17

[realtime]
enabled = true

[studio]
enabled = false

# Sign-in codes land here locally: http://127.0.0.1:54324
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

# Serves supabase/functions/mcp at http://127.0.0.1:54321/functions/v1/mcp
[edge_runtime]
enabled = true
deno_version = 2

[edge_runtime.secrets]
# Inside the stack, SUPABASE_URL is an internal address; this is the one clients use.
CUE_PUBLIC_URL = "http://127.0.0.1:54321"

# The function checks tokens itself, so it can answer with the 401 MCP clients expect.
[functions.mcp]
verify_jwt = false

[analytics]
enabled = false

[auth]
# The site (site/) served locally, for the MCP consent page: python3 -m http.server 4173 -d site
site_url = "http://127.0.0.1:4173"
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Sign in with Apple on the Mac comes back from the browser to a one-shot server on a
# loopback port (src/main/sync/browserReturn.ts).
additional_redirect_urls = ["http://127.0.0.1:*/auth/callback"]

[auth.email]
enable_signup = true
enable_confirmations = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 900

# Cue signs in with a six-digit code typed into the app, not a link, so both
# emails a new or returning user can receive show the code.
[auth.email.template.magic_link]
subject = "Your Cue sign-in code"
content_path = "./supabase/templates/sign-in-code.html"

[auth.email.template.confirmation]
subject = "Your Cue sign-in code"
content_path = "./supabase/templates/sign-in-code.html"

# Sign in with Apple. The iPhone's identity tokens name the app's bundle ID, so the local
# stack can check them from a simulator signed in to an Apple Account. The Mac's browser
# sign-in needs a Services ID, a secret and an HTTPS callback, so only a hosted project
# offers it (docs/SYNC.md).
[auth.external.apple]
enabled = true
client_id = "app.cue"
secret = ""

# Lets AI assistants connect over MCP: they register themselves, then send people to
# the site's consent page (site_url + authorization_url_path).
[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = true
