# The account is deleted on another device. A phone that writes finds out at its next
# push; one that only reads finds out when it comes back to the foreground. Either way
# sync stops, the header says so, Settings says why, and every note stays on the phone,
# as on the Mac. Also: an address that can't be one gets the Mac's words.
appId: app.cue
name: Account deleted
---
- runFlow: subflows/launch.yaml
- runScript: scripts/today.js
- tapOn: "Settings"
- tapOn: "Turn On Sync…"
- extendedWaitUntil:
    visible: "Sign in to sync your notes"
    timeout: 10000
- tapOn:
    id: "email"
- inputText: "not-an-email"
- tapOn: "Send Code"
- assertVisible: "That doesn’t look like an email address."
- tapOn:
    id: sign-in-cancel
- tapOn:
    id: sheet-close

- runScript:
    file: scripts/email.js
    env:
      PREFIX: deleted-a
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.email}
- runScript:
    file: scripts/delete-from-another-device.js
    env:
      EMAIL: ${output.email}
      SUPABASE_KEY: ${SUPABASE_KEY}

# Writing after the deletion: the push is refused, the server confirms, and sync stops.
# The line stays on the phone, unsent.
- tapOn:
    id: ${'new-line-' + output.today}
- inputText: "Written after it was deleted"
- tapOn:
    id: tool-hide
- extendedWaitUntil:
    visible: "Sign in to sync"
    timeout: 15000
- assertVisible:
    id: "0/text:Written after it was deleted"
- tapOn: "Sign in to sync"
- assertVisible: "Your account was deleted on another device. Notes on this iPhone stay here."
- assertVisible: "Turn On Sync…"
- tapOn:
    id: sheet-close

# After a relaunch, the line and the reason are both still there.
- launchApp
- extendedWaitUntil:
    visible:
      id: "day-title"
    timeout: 15000
- assertVisible:
    id: "0/text:Written after it was deleted"
- assertVisible: "Sign in to sync"

# Turning sync on with another account takes the unsent line along, as on the Mac.
- runScript:
    file: scripts/email.js
    env:
      PREFIX: deleted-b
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.email}
- assertNotVisible: "Sign in to sync"
- runScript:
    file: scripts/push-from-another-device.js
    env:
      EMAIL: ${output.email}
      TODAY: ${output.today}
      TEXT: "Written on the Mac"
      SUPABASE_KEY: ${SUPABASE_KEY}
- retry:
    maxRetries: 3
    commands:
      - runScript:
          file: scripts/pull-from-another-device.js
          env:
            TEXT: "Written after it was deleted"
            SUPABASE_KEY: ${SUPABASE_KEY}
      - assertTrue: ${output.found}

# A phone that only reads: deleted elsewhere, it finds out when it comes back.
- runScript:
    file: scripts/delete-from-another-device.js
    env:
      EMAIL: ${output.email}
      SUPABASE_KEY: ${SUPABASE_KEY}
- pressKey: Home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Sign in to sync"
    timeout: 15000
