# Switching accounts: when one account's notes leave the phone, so does everything the
# editor remembered about them. Undo on the next account can't bring a line back.
#
# The long swipe uses the first line's position, measured on an iPhone 17 Pro.
appId: app.cue
name: Account switch
---
- runFlow: subflows/launch.yaml
- runScript: scripts/today.js
- runScript:
    file: scripts/email.js
    env:
      PREFIX: account-switch-a
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.email}

- tapOn:
    id: ${'new-line-' + output.today}
- inputText: "Secret A1"
- tapOn:
    id: tool-hide
# A long swipe left deletes it (the toast offers Undo).
- swipe:
    start: "95%,32%"
    end: "3%,32%"
    duration: 400
- extendedWaitUntil:
    visible: "Deleted"
    timeout: 5000
- assertNotVisible: "Secret A1"

- tapOn: "Settings"
- tapOn: "Sign Out"
- extendedWaitUntil:
    visible: "Sign out?"
    timeout: 10000
- tapOn:
    text: "Sign Out"
    index: 0
- extendedWaitUntil:
    visible: "Sign in to sync your notes"
    timeout: 10000

# A different account: nothing from the first one may come back, on screen or on the server.
- runScript:
    file: scripts/email.js
    env:
      PREFIX: account-switch-b
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.email}
- tapOn:
    id: ${'new-line-' + output.today}
- tapOn:
    id: tool-undo
- assertNotVisible: "Secret A1"
- tapOn:
    id: tool-undo
- tapOn:
    id: tool-undo
- assertNotVisible: "Secret A1"
- assertVisible:
    id: "day-title"
    text: "Today"

# Another device signs in to B (writing a line as it does) and reads the account back.
- tapOn:
    id: tool-hide
- runScript:
    file: scripts/push-from-another-device.js
    env:
      EMAIL: ${output.email}
      TODAY: ${output.today}
      TEXT: "Written on the Mac"
      SUPABASE_KEY: ${SUPABASE_KEY}
- runScript:
    file: scripts/pull-from-another-device.js
    env:
      TEXT: "Secret A1"
      SUPABASE_KEY: ${SUPABASE_KEY}
- assertTrue: ${!output.found}
