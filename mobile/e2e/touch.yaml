# Touch: tap a bullet to make it a to-do and a box to check it, swipe right to advance a
# line (to-do, then done), swipe left to send it to tomorrow (with Undo), and long-press
# to drag: up and down to reorder, sideways to nest. Swiping the page off the lines turns
# to the next or previous day.
#
# The drag steps use screen positions measured on an iPhone 17 Pro.
appId: app.cue
name: Touch
---
- runFlow: subflows/launch.yaml
- runScript: scripts/today.js

- tapOn:
    id: ${'new-line-' + output.today}
- inputText: "Alpha"
- pressKey: Enter
- inputText: "- Bravo"
- pressKey: Enter
- inputText: "Charlie"
- tapOn:
    id: tool-hide

# Tap the bullet: it becomes a to-do. Tap the box, here in the margin beside it: done.
- tapOn:
    point: "6%,36%"
- assertVisible:
    id: "0/todo:Bravo"
- tapOn:
    point: "3%,36%"
- assertVisible:
    id: "0/todo-done:Bravo"

# Swipe right: text becomes a to-do, then a to-do is completed.
- swipe:
    from:
      id: "0/text:Alpha"
    direction: RIGHT
- assertVisible:
    id: "0/todo:Alpha"
- swipe:
    from:
      id: "0/todo:Alpha"
    direction: RIGHT
- assertVisible:
    id: "0/todo-done:Alpha"

# Swipe left: tomorrow. The toast's Undo brings it back.
- swipe:
    from:
      id: "0/bullet:Charlie"
    direction: LEFT
- assertVisible: "Moved to tomorrow"
- assertNotVisible:
    id: "0/bullet:Charlie"
- tapOn: "Undo"
- assertVisible:
    id: "0/bullet:Charlie"

# Long-press Charlie and drag it to the top.
- swipe:
    start: "50%,40%"
    end: "50%,30%"
    duration: 1500
- assertVisible:
    id: "0/bullet:Charlie"
    above:
      id: "0/todo-done:Alpha"

# Long-press Bravo (now last) and drag it right: it nests under Alpha. The finger has to
# all but hold still until the line lifts; one already moving sideways is a swipe.
- swipe:
    start: "50%,40%"
    end: "60%,40%"
    duration: 3000
- assertVisible:
    id: "1/todo-done:Bravo"

# Swipe the open page below the lines: left is tomorrow, right is back to today.
- swipe:
    start: "80%,75%"
    end: "20%,75%"
    duration: 300
- assertVisible:
    id: day-title
    text: "Tomorrow"
- swipe:
    start: "20%,75%"
    end: "80%,75%"
    duration: 300
- assertVisible:
    id: day-title
    text: "Today"
- assertVisible:
    id: "1/todo-done:Bravo"
