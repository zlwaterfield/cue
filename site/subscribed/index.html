body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
  background: var(--bg); color: var(--text);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
main { width: 100%; max-width: 380px; }
.symbol { display: block; width: 28px; height: 28px; margin-bottom: 28px; }
h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 8px; }
p { margin: 0 0 16px; color: var(--text-2); }
