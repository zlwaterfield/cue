<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Nothing here yet · Cue</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FAFAFB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18181A" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
<style>
/* Tokens from docs/brand/tokens/tokens.css, as on the home page. */
:root {
  color-scheme: light;
  --bg: #FAFAFB; --text: #1C1C1E; --text-2: #6C6C72; --text-3: #8E8E94; --accent: #2C2C31;
  --text-selection: #2C2C3129;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #18181A; --text: #ECECEF; --text-2: #9D9DA4; --text-3: #76767D; --accent: #E6E6EA;
    --text-selection: #E6E6EA38;
  }
}
* { box-sizing: border-box; }
::selection { background: var(--text-selection); }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
  background: var(--bg); color: var(--text);
  font: 17px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
main { width: 100%; max-width: 560px; }
.serif { font-family: "Newsreader", "New York", ui-serif, Georgia, serif; font-weight: 400;
  letter-spacing: -0.02em; font-optical-sizing: auto; }
.date { font-size: 15px; color: var(--text-3); }
h1 { font-size: clamp(40px, 7vw, 64px); line-height: 1.05; margin: 8px 0 14px; }
.line { min-height: 1.55em; font-size: 20px; color: var(--text); overflow-wrap: anywhere; }
.line.empty::after { content: "Start typing…"; color: var(--text-3); }
.caret { display: inline-block; width: 2px; height: 1.1em; margin-right: 2px; vertical-align: -0.2em;
  background: var(--accent); border-radius: 1px; animation: blink 1.1s steps(1) infinite; }
.line:not(.empty) .caret { margin: 0 0 0 1px; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
a { display: inline-block; margin-top: 36px; font-size: 15px; color: var(--text-2); text-decoration: none; }
a:hover { color: var(--text); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="date"></p>
  <h1 class="serif">Nothing here yet.</h1>
  <p class="line empty" aria-hidden="true"><span class="typed"></span><span class="caret"></span></p>
  <a href="/">← Back to today</a>
</main>
<script>
// An empty page, like an empty day: type and it's yours, until you leave.
(() => {
  const now = new Date()
  document.querySelector('.date').textContent =
    now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })
  const line = document.querySelector('.line'), typed = document.querySelector('.typed')
  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.isComposing) return
    if (e.key === 'Backspace') typed.textContent = typed.textContent.slice(0, -1)
    else if (e.key.length === 1 && typed.textContent.length < 80) typed.textContent += e.key
    else return
    e.preventDefault()
    line.classList.toggle('empty', !typed.textContent)
  })
})()
</script>
</body>
</html>
