<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Nothing here yet · Cue</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FAFAFB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18181A" media="(prefers-color-scheme: dark)">
<link rel="preload" href="/fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/cue.css">
<!-- The light/dark choice from the last page, before the first paint. -->
<script>try { const t = localStorage.getItem('cue-theme'); if (t) document.documentElement.dataset.theme = t } catch {}</script>
<style>
body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
main { width: 100%; max-width: 560px; }
.date { font-size: 15px; color: var(--text-3); }
h1 { font-size: clamp(40px, 7vw, 64px); line-height: 1.05; margin: 8px 0 14px; }
.line { min-height: 1.55em; font-size: 20px; color: var(--text); overflow-wrap: anywhere; }
.line.empty::after { content: "Start typing…"; color: var(--text-3); }
.caret { display: inline-block; width: 2px; height: 1.1em; margin-right: 2px; vertical-align: -0.2em;
  background: var(--accent); border-radius: 1px; animation: blink 1.1s steps(1) infinite; }
.line:not(.empty) .caret { margin: 0 0 0 1px; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
a { display: inline-block; margin-top: 36px; font-size: 15px; color: var(--text-2); text-decoration: none; }
a:hover { color: var(--text); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="date"></p>
  <h1 class="serif">Nothing here yet.</h1>
  <p class="line empty" aria-hidden="true"><span class="typed"></span><span class="caret"></span></p>
  <a href="/">← Back to today</a>
</main>
<script src="/cue.js" defer></script>
<script src="/404.js" defer></script>
</body>
</html>
